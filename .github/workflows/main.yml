name: Build New Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif find . -mindepth 2 -maxdepth 5 -name gradlew -type f | grep -q .; then
            FILE=$(find . -mindepth 2 -maxdepth 5 -name gradlew -type f | head -n 1)
            echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle wrapper (gradlew) not found."
            echo "This project may not be a native Android/Gradle project."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x "${{ steps.project.outputs.dir }}/gradlew"

      - name: Build fresh APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload new APK
        uses: actions/upload-artifact@v4
        with:
          name: Fresh-Android-APK
          path: |
            ${{ steps.project.outputs.dir }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          
