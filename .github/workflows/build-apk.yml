
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -n "$WRAPPER" ]; then
            DIR=$(dirname "$WRAPPER")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          else
            SETTINGS=$(find . -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Gradle project not found"
              exit 1
            fi

            DIR=$(dirname "$SETTINGS")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Project directory: $DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ "${{ steps.project.outputs.wrapper }}" = "true" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zatca-qr-reader-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
