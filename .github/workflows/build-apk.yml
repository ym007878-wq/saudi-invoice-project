
name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            FILE=$(find . -mindepth 2 -maxdepth 5 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -type f | head -n 1)

            if [ -z "$FILE" ]; then
              echo "ERROR: Android Gradle project not found."
              exit 1
            fi

            echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fresh APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace
          else
            gradle --no-daemon clean assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zatca-qr-reader-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
